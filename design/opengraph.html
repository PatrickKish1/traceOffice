<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; background: #070c0a; }
      .card {
        width: 1200px;
        height: 630px;
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(820px 520px at 82% 58%, rgba(62, 207, 142, 0.18), transparent 62%),
          radial-gradient(640px 420px at 8% 100%, rgba(125, 211, 252, 0.08), transparent 60%),
          radial-gradient(500px 280px at 70% 0%, rgba(251, 113, 133, 0.08), transparent 70%),
          #070c0a;
        color: #e7f2ec;
        font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
      }
      .grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.18;
        mix-blend-mode: overlay;
      }
      .copy {
        position: absolute;
        left: 64px;
        top: 52px;
        width: 640px;
        z-index: 2;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: Manrope, ui-sans-serif, sans-serif;
        font-weight: 800;
        font-size: 28px;
        letter-spacing: -1.2px;
      }
      .brand span { color: #3ecf8e; }
      .dots {
        width: 22px;
        height: 22px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        transform: rotate(-12deg);
      }
      .dots i { width: 8px; height: 8px; border-radius: 50%; background: #d7efe4; display: block; }
      .dots i:nth-child(2) { background: #3ecf8e; }
      h1 {
        margin-top: 54px;
        font-family: Manrope, ui-sans-serif, sans-serif;
        font-weight: 800;
        font-size: 78px;
        line-height: 0.9;
        letter-spacing: -3.4px;
      }
      h1 em {
        font-style: normal;
        color: #3ecf8e;
      }
      .sub {
        margin-top: 28px;
        max-width: 460px;
        font-size: 22px;
        line-height: 1.35;
        color: #a8c4b4;
        letter-spacing: -0.3px;
      }
      .spans {
        margin-top: 42px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .span {
        height: 36px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        padding: 0 14px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.2px;
        color: #07110e;
      }
      .span.plan { width: 132px; background: #7dd3fc; }
      .span.edit { width: 108px; background: #3ecf8e; }
      .span.fail { width: 86px; background: #fb7185; }
      .span.review { width: 118px; background: #fbbf24; }
      .scene {
        position: absolute;
        right: 0;
        top: 0;
        width: 640px;
        height: 630px;
      }
      .edge {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 1px;
        background: linear-gradient(transparent, #2a3a34 20%, #2a3a34 80%, transparent);
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="grain" width="1200" height="630" aria-hidden="true">
        <filter id="n">
          <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" />
        </filter>
        <rect width="1200" height="630" filter="url(#n)" />
      </svg>
      <div class="copy">
        <div class="brand">
          <span class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          trace<span>office</span>
        </div>
        <h1>Running is not<br />the same as<br />work<em>ing.</em></h1>
        <p class="sub">A dark office where every agent run is a character you can walk over to.</p>
        <div class="spans" aria-hidden="true">
          <div class="span plan">plan</div>
          <div class="span edit">edit</div>
          <div class="span fail">fail</div>
          <div class="span review">review</div>
        </div>
      </div>
      <svg class="scene" viewBox="0 0 640 630" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#182420" />
            <stop offset="1" stop-color="#0d1412" />
          </linearGradient>
          <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1c2c26" />
            <stop offset="1" stop-color="#101816" />
          </linearGradient>
          <radialGradient id="win" cx="50%" cy="40%" r="60%">
            <stop offset="0" stop-color="#d7fff0" />
            <stop offset="0.45" stop-color="#3ecf8e" />
            <stop offset="1" stop-color="#12352c" />
          </radialGradient>
          <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="8" />
          </filter>
          <filter id="screen" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3" result="b" />
            <feMerge>
              <feMergeNode in="b" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <path d="M80 150 H620 V520 H40 Z" fill="url(#floor)" />
        <path d="M80 150 H620 V210 H110 Z" fill="url(#wall)" />
        <path d="M40 520 H620" stroke="#2a3a34" stroke-width="1" />

        <g opacity="0.55">
          <path d="M120 210 H600" stroke="#24342e" />
          <path d="M150 250 H610" stroke="#24342e" />
          <path d="M110 300 H620" stroke="#24342e" />
          <path d="M70 360 H620" stroke="#24342e" />
          <path d="M40 430 H620" stroke="#24342e" />
          <path d="M180 150 L40 520" stroke="#24342e" />
          <path d="M300 150 L180 520" stroke="#24342e" />
          <path d="M430 150 L340 520" stroke="#24342e" />
          <path d="M560 150 L520 520" stroke="#24342e" />
        </g>

        <g>
          <rect x="150" y="118" width="100" height="64" rx="8" fill="#0c1210" stroke="#3ecf8e" stroke-opacity="0.45" />
          <rect x="156" y="124" width="88" height="52" rx="4" fill="url(#win)" />
          <rect x="286" y="112" width="116" height="70" rx="8" fill="#0c1210" stroke="#7dd3fc" stroke-opacity="0.35" />
          <rect x="292" y="118" width="104" height="58" rx="4" fill="#163044" />
          <rect x="298" y="124" width="46" height="46" fill="#7dd3fc" opacity="0.4" />
          <rect x="438" y="122" width="100" height="60" rx="8" fill="#0c1210" stroke="#fb7185" stroke-opacity="0.55" />
          <rect x="444" y="128" width="88" height="48" rx="4" fill="#3a1820" />
          <rect x="450" y="134" width="32" height="36" fill="#fb7185" opacity="0.55" />
        </g>

        <ellipse cx="250" cy="470" rx="150" ry="28" fill="#3ecf8e" opacity="0.08" filter="url(#soft)" />
        <ellipse cx="470" cy="500" rx="120" ry="22" fill="#fb7185" opacity="0.12" filter="url(#soft)" />

        <!-- desks -->
        <g>
          <rect x="150" y="392" width="150" height="14" rx="4" fill="#5c6b62" />
          <rect x="158" y="406" width="8" height="36" fill="#1c2622" />
          <rect x="284" y="406" width="8" height="36" fill="#1c2622" />
          <rect x="196" y="352" width="52" height="34" rx="3" fill="#101816" />
          <rect x="200" y="356" width="44" height="22" rx="2" fill="#14352c" filter="url(#screen)" />
          <rect x="214" y="386" width="16" height="8" fill="#2a3330" />

          <rect x="330" y="408" width="140" height="13" rx="4" fill="#4a564f" />
          <rect x="338" y="421" width="8" height="32" fill="#1c2622" />
          <rect x="454" y="421" width="8" height="32" fill="#1c2622" />
          <rect x="368" y="372" width="48" height="30" rx="3" fill="#101816" />
          <rect x="372" y="376" width="40" height="18" rx="2" fill="#3a2a12" />

          <rect x="500" y="430" width="130" height="12" rx="4" fill="#3d4a44" />
          <rect x="508" y="442" width="8" height="28" fill="#1c2622" />
          <rect x="614" y="442" width="8" height="28" fill="#1c2622" />
          <rect x="532" y="396" width="46" height="28" rx="3" fill="#101816" />
          <rect x="536" y="400" width="38" height="16" rx="2" fill="#4a1822" />
        </g>

        <!-- handoff arc -->
        <path d="M250 330 C 310 270, 390 270, 430 330" stroke="#3ecf8e" stroke-width="2" stroke-dasharray="5 6" opacity="0.9" />
        <circle cx="430" cy="330" r="4" fill="#3ecf8e" />

        <!-- working character -->
        <g transform="translate(196 268) scale(1.12)">
          <ellipse cx="28" cy="128" rx="26" ry="6" fill="#000" opacity="0.35" />
          <rect x="16" y="78" width="6" height="36" rx="3" fill="#121816" />
          <rect x="34" y="78" width="6" height="36" rx="3" fill="#121816" />
          <ellipse cx="19" cy="114" rx="8" ry="5" fill="#0f766e" />
          <ellipse cx="37" cy="114" rx="8" ry="5" fill="#0f766e" />
          <ellipse cx="28" cy="58" rx="28" ry="32" fill="#5eead4" />
          <circle cx="18" cy="52" r="4.5" fill="#121816" />
          <circle cx="36" cy="52" r="4.5" fill="#121816" />
          <circle cx="16.5" cy="50.5" r="1.4" fill="#f4fff8" />
          <circle cx="34.5" cy="50.5" r="1.4" fill="#f4fff8" />
          <rect x="34" y="8" width="3" height="22" rx="1.5" fill="#0f766e" />
          <circle cx="35.5" cy="8" r="5" fill="#3ecf8e" />
          <rect x="62" y="18" width="78" height="26" rx="13" fill="#141c19" stroke="#2a3a34" />
          <text x="74" y="36" fill="#3ecf8e" font-family="DM Sans, sans-serif" font-size="13" font-weight="600">working</text>
        </g>

        <!-- handoff character -->
        <g transform="translate(368 292) scale(1.12)">
          <ellipse cx="26" cy="118" rx="24" ry="6" fill="#000" opacity="0.35" />
          <rect x="14" y="72" width="6" height="32" rx="3" fill="#121816" />
          <rect x="32" y="72" width="6" height="32" rx="3" fill="#121816" />
          <ellipse cx="17" cy="104" rx="8" ry="5" fill="#b45309" />
          <ellipse cx="35" cy="104" rx="8" ry="5" fill="#b45309" />
          <ellipse cx="26" cy="52" rx="26" ry="30" fill="#fbbf24" />
          <rect x="4" y="40" width="44" height="16" rx="8" fill="#121816" opacity="0.18" />
          <rect x="6" y="42" width="40" height="14" rx="7" fill="none" stroke="#121816" stroke-width="3.5" />
          <circle cx="16" cy="48" r="3.2" fill="#121816" />
          <circle cx="34" cy="48" r="3.2" fill="#121816" />
          <rect x="58" y="8" width="86" height="26" rx="13" fill="#141c19" stroke="#2a3a34" />
          <text x="70" y="26" fill="#fbbf24" font-family="DM Sans, sans-serif" font-size="13" font-weight="600">hand-off</text>
        </g>

        <!-- failed character -->
        <g transform="translate(486 318) scale(1.12)">
          <ellipse cx="30" cy="132" rx="36" ry="8" fill="none" stroke="#fb7185" stroke-width="3" />
          <ellipse cx="30" cy="132" rx="22" ry="5" fill="#000" opacity="0.35" />
          <rect x="16" y="84" width="6" height="34" rx="3" fill="#121816" />
          <rect x="36" y="84" width="6" height="34" rx="3" fill="#121816" />
          <ellipse cx="19" cy="118" rx="8" ry="5" fill="#be123c" />
          <ellipse cx="39" cy="118" rx="8" ry="5" fill="#be123c" />
          <ellipse cx="30" cy="58" rx="30" ry="34" fill="#fb7185" />
          <circle cx="20" cy="54" r="4.2" fill="#121816" />
          <circle cx="40" cy="54" r="4.2" fill="#121816" />
          <path d="M18 76 Q30 66 42 76" stroke="#121816" stroke-width="2.4" fill="none" stroke-linecap="round" />
          <rect x="46" y="18" width="14" height="10" rx="2" fill="#be123c" />
          <rect x="-36" y="146" width="132" height="26" rx="13" fill="#141c19" stroke="#fb7185" />
          <text x="-22" y="164" fill="#fb7185" font-family="DM Sans, sans-serif" font-size="13" font-weight="600">needs a person</text>
        </g>
      </svg>
      <div class="edge"></div>
    </div>
  </body>
</html>
